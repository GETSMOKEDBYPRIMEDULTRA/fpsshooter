<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Multiplayer FPS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #1a1a1a; font-family: Arial, sans-serif; user-select: none; }
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; background: rgba(0,0,0,0.85); padding: 40px; border-radius: 15px; border: 2px solid #444; z-index: 10; width: 300px; }
        h1 { margin-bottom: 20px; font-size: 24px; letter-spacing: 1px; }
        button { display: block; width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; background: #28a745; color: white; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #218838; }
        
        /* Reticle for PC Aiming */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); border: 2px solid #000; transform: translate(-50%, -50%); display: none; pointer-events: none; z-index: 5; }
        
        /* Mobile Touch UI Layout (Hidden on PC by default) */
        #mobile-ui { position: absolute; bottom: 30px; width: 100%; height: 120px; display: none; pointer-events: none; z-index: 8; }
        .joystick { position: absolute; width: 90px; height: 90px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        #move-stick { left: 40px; }
        #look-stick { right: 40px; }
    </style>
</head>
<body>

    <div id="crosshair"></div>

    <div id="menu">
        <h1>3D FPS PROTOTYPE</h1>
        <button onclick="startGame()">START GAME & SPAWN BOTS</button>
    </div>

    <div id="mobile-ui">
        <div id="move-stick" class="joystick"></div>
        <div id="look-stick" class="joystick"></div>
    </div>

    <script>
        let scene, camera, renderer, player;
        let moveDirection = new THREE.Vector3();
        let bots = [];
        let isPlaying = false;
        let keys = {};

        // Detect if user is on mobile/tablet to turn on mobile inputs
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        function startGame() {
            document.getElementById("menu").style.display = "none";
            document.getElementById("crosshair").style.display = "block";
            
            // Show touch UI components only if the client is an iPad or phone
            if (isMobile) {
                document.getElementById("mobile-ui").style.display = "block";
            }
            
            init3D();
            isPlaying = true;
        }

        function init3D() {
            // Scene Setup with an explicit Sky Blue Background
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Add Ground Floor Grid Grid
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x3b7a57 }); // Dark Green Grass
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(300, 60, 0x000000, 0xffffff);
            grid.position.y = 0.02;
            scene.add(grid);

            // Lighting Engine
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            // Player Setup
            player = new THREE.Object3D();
            player.position.set(0, 2, 5);
            scene.add(player);
            player.add(camera);

            setupInputHandlers();
            spawnEnemyTargets(12);
            animateLoop();
        }

        function spawnEnemyTargets(count) {
            for(let i=0; i<count; i++) {
                // Large red cylinders to serve as basic bots
                const botGeo = new THREE.CylinderGeometry(1, 1, 3, 12);
                const botMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const bot = new THREE.Mesh(botGeo, botMat);
                
                // Scatter cylinders across the map
                bot.position.set(Math.random() * 60 - 30, 1.5, Math.random() * -60 - 10);
                bot.health = 100;
                bot.isDead = false;
                
                scene.add(bot);
                bots.push(bot);
            }
        }

        function applyOPAimAssistAndAutoShoot() {
            let targetBot = null;
            let precisionAngle = 0.95; // Snap range

            bots.forEach(bot => {
                if (bot.isDead) return;
                let botPos = bot.position.clone();
                let directionToBot = botPos.sub(player.position).normalize();
                
                let lookDirection = new THREE.Vector3();
                camera.getWorldDirection(lookDirection);

                let focusScore = lookDirection.dot(directionToBot);
                if (focusScore > precisionAngle) {
                    targetBot = bot;
                }
            });

            if (targetBot) {
                // Aggressively force camera gaze to center target point
                camera.lookAt(targetBot.position);
                
                // AUTO SHOOT: Deduct health frame by frame when locked on
                targetBot.health -= 4;
                targetBot.material.color.setHex(0xffff00); // Highlight yellow
                
                if (targetBot.health <= 0) {
                    targetBot.isDead = true;
                    scene.remove(targetBot);
                }
            } else {
                // Revert color to base layout if target is lost
                bots.forEach(b => { if(!b.isDead) b.material.color.setHex(0xff0000); });
            }
        }

        function setupInputHandlers() {
            // Listeners for PC Keyboards
            window.addEventListener('keydown', (e) => { keys[e.code] = true; });
            window.addEventListener('keyup', (e) => { keys[e.code] = false; });
            
            // Pointer lock captures mouse inside browser window when clicking map
            document.body.addEventListener('click', () => {
                if(isPlaying && !isMobile) document.body.requestPointerLock();
            });
            
            window.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    player.rotation.y -= e.movementX * 0.003;
                    camera.rotation.x -= e.movementY * 0.003;
                    camera.rotation.x = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, camera.rotation.x));
                }
            });
        }

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            if (!isPlaying) return;

            // Compute physics ticks for PC movement speeds
            let currentSpeed = 0.18;
            if (keys['KeyW'] || keys['ArrowUp']) player.translateOnAxis(new THREE.Vector3(0,0,-1), currentSpeed);
            if (keys['KeyS'] || keys['ArrowDown']) player.translateOnAxis(new THREE.Vector3(0,0,1), currentSpeed);
            if (keys['KeyA'] || keys['ArrowLeft']) player.translateOnAxis(new THREE.Vector3(-1,0,0), currentSpeed);
            if (keys['KeyD'] || keys['ArrowRight']) player.translateOnAxis(new THREE.Vector3(1,0,0), currentSpeed);

            // Anchor view constraints
            player.position.y = 2;

            applyOPAimAssistAndAutoShoot();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
